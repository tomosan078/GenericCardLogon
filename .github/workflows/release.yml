name: Build and Release Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build GCL Installer
        shell: pwsh
        run: .\Build-GCL-Installer.ps1

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'src\GenericCardLogon.Installer\bin\x64\Release\net48\GCL-Installer.exe'
          if (-not (Test-Path $installer)) {
            throw "Installer was not produced: $installer"
          }
          $size = (Get-Item $installer).Length
          if ($size -lt 100KB) {
            throw "Installer is unexpectedly small: $size bytes"
          }
          Get-FileHash $installer -Algorithm SHA256 | Format-List

      - name: Package installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE 'src\GenericCardLogon.Installer\bin\x64\Release\net48\GCL-Installer.exe'
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev-$env:GITHUB_RUN_NUMBER" }
          $package = Join-Path $env:GITHUB_WORKSPACE "GCL-Installer-$version.exe"
          Copy-Item $installer $package -Force
          "INSTALLER=$package" | Out-File $env:GITHUB_ENV -Append
          Get-FileHash $package -Algorithm SHA256 | Format-List

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: GenericCardLogon ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.INSTALLER }}
          fail_on_unmatched_files: true
