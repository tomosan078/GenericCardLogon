name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore .NET projects
        shell: pwsh
        run: |
          dotnet restore src/GenericCardLogon.Core/GenericCardLogon.Core.csproj
          dotnet restore src/GenericCardLogon.Service/GenericCardLogon.Service.csproj
          dotnet restore src/GenericCardLogon.Manager/GenericCardLogon.Manager.csproj

      - name: Build and package installer
        shell: pwsh
        run: |
          .\Build-GCL-Installer.ps1

      - name: Find installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path . -Filter "GCL-Installer.exe" -Recurse -File |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "GCL-Installer.exe was not found."
            exit 1
          }

          Write-Host "Installer: $($installer.FullName)"
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Calculate SHA-256
        id: hash
        shell: pwsh
        run: |
          $path = "${{ steps.installer.outputs.path }}"
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash
          Write-Host "SHA-256: $hash"
          "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.installer.outputs.path }}
          body: |
            ## GenericCardLogon Release

            Windows x64 installer:

            `GCL-Installer.exe`

            ### SHA-256

            `${{ steps.hash.outputs.hash }}`
