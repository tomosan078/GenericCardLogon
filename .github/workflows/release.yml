name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify release tag matches application version
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$props = Get-Content -LiteralPath .\Directory.Build.props -Raw
          $expectedTag = "v$($props.Project.PropertyGroup.Version)"

          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Tag '$env:RELEASE_TAG' does not match application version '$expectedTag'."
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild .\GenericCardLogon-RC-S380.sln `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet restore failed."
          }

      - name: Build GCL Installer
        shell: pwsh
        run: |
          .\Build-GCL-Installer.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "GCL installer build failed."
          }

      - name: Collect release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts\package | Out-Null

          $installer = Get-ChildItem `
            -Path . `
            -Filter "GCL-Installer.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $installer) {
            throw "GCL-Installer.exe was not found."
          }

          Copy-Item `
            -LiteralPath $installer.FullName `
            -Destination .\artifacts\package\GCL-Installer.exe `
            -Force

          Write-Host "Installer:"
          Write-Host $installer.FullName

      - name: Create SHA256SUMS
        shell: pwsh
        run: |
          $file = ".\artifacts\package\GCL-Installer.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash

          "$hash  GCL-Installer.exe" |
            Out-File `
              -FilePath ".\artifacts\package\SHA256SUMS.txt" `
              -Encoding ascii

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenericCardLogon-win-x64
          path: artifacts/package
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: windows-x64

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: GenericCardLogon-win-x64
          path: artifacts/package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GenericCardLogon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/package/GCL-Installer.exe
            artifacts/package/SHA256SUMS.txt
